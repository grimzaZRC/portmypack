# .github/workflows/extract-zip.yml
name: Extract portmypack-web.zip

on:
  push:
    paths:
      - "portmypack-web.zip"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Unzip archive into repo root
        run: |
          unzip -o portmypack-web.zip -d .
          rm -f portmypack-web.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract portmypack-web.zip"
          git push origin main
