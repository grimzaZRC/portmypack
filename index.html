<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PortMyPack — Java to Bedrock Resource Pack Converter</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --accent: #5eead4;
    --accent-dark: #14b8a6;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: rgba(94, 234, 212, 0.04);
  }
  .dropzone svg { opacity: .6; margin-bottom: 8px; }
  .dropzone .main { font-size: 14px; color: var(--text); }
  .dropzone .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=file] { display: none; }
  .filename {
    margin-top: 14px;
    font-size: 13px;
    color: var(--accent);
    word-break: break-all;
    display: none;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent-dark);
    color: #06251f;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .status.error { color: var(--error); }
  .status.ok { color: var(--accent); }
  .console {
    margin-top: 16px;
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 160px;
    overflow-y: auto;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    display: none;
  }
  .console.show { display: block; }
  .console .line { white-space: pre-wrap; word-break: break-word; }
  .console .line .t { color: var(--muted); margin-right: 8px; }
  .console .line.info { color: #a5b4cf; }
  .console .line.ok { color: var(--accent); }
  .console .line.error { color: var(--error); }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>PortMyPack</h1>
    <p class="sub">Convert a Minecraft Java Edition resource pack into a Bedrock Edition <code>.mcpack</code>. Upload the Java pack as a <code>.zip</code> — everything runs server-side, your file isn't stored.</p>

    <label class="dropzone" id="dropzone">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8b93a3" stroke-width="1.5"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="main">Click to choose, or drag a .zip here</div>
      <div class="hint">Java resource pack, .zip format</div>
      <input type="file" id="fileInput" accept=".zip" />
    </label>
    <div class="filename" id="filename"></div>

    <button id="convertBtn" disabled>Convert to Bedrock</button>
    <div class="status" id="status"></div>
    <div class="console" id="console"></div>

    <footer>Built with <a href="https://github.com/restartfu/portmypack" target="_blank" rel="noopener">portmypack</a></footer>
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const convertBtn = document.getElementById('convertBtn');
  const statusEl = document.getElementById('status');
  const consoleEl = document.getElementById('console');
  let selectedFile = null;

  function log(msg, kind) {
    consoleEl.classList.add('show');
    const line = document.createElement('div');
    line.className = 'line' + (kind ? ' ' + kind : '');
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = new Date().toLocaleTimeString([], { hour12: false });
    line.appendChild(t);
    line.appendChild(document.createTextNode(msg));
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function clearLog() {
    consoleEl.innerHTML = '';
    consoleEl.classList.remove('show');
  }

  function setFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.zip')) {
      setStatus('Please choose a .zip file.', 'error');
      return;
    }
    selectedFile = file;
    filenameEl.textContent = file.name;
    filenameEl.style.display = 'block';
    convertBtn.disabled = false;
    setStatus('', '');
    clearLog();
    log('Selected ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)', 'info');
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    setFile(file);
  });

  convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    convertBtn.disabled = true;
    setStatus('Converting…', '');

    const startedAt = performance.now();
    log('Uploading to /api/convert …', 'info');

    try {
      const formData = new FormData();
      formData.append('pack', selectedFile);

      const res = await fetch('/api/convert', {
        method: 'POST',
        body: formData
      });

      const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);

      if (!res.ok) {
        const text = await res.text();
        log('Server responded ' + res.status + ' after ' + elapsed + 's', 'error');
        if (text) log(text.trim(), 'error');
        throw new Error(text || ('Server error (' + res.status + ')'));
      }

      log('Server responded 200 after ' + elapsed + 's — downloading result…', 'ok');

      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="?([^"]+)"?/);
      const outName = match ? match[1] : (selectedFile.name.replace(/\.zip$/i, '') + '.mcpack');

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      log('Downloaded ' + outName + ' (' + (blob.size / 1024 / 1024).toFixed(2) + ' MB)', 'ok');
      setStatus('Done — downloaded ' + outName, 'ok');
    } catch (err) {
      if (err.name === 'TypeError') {
        log('Network error — request never reached the server', 'error');
      }
      setStatus(err.message || 'Something went wrong.', 'error');
    } finally {
      convertBtn.disabled = false;
    }
  });
</script>
</body>
</html>
